# SPDX-License-Identifier: Apache-2.0

name: Stage 1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo xtask ci stage1

