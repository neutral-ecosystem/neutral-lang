# Local defaults for repository automation. Environment overrides are optional:
# NEUTRAL_CARGO_COMMAND, NEUTRAL_RUSTC_COMMAND, NEUTRAL_TEST_RESULTS,
# and NEUTRAL_TEST_RUNNER (nextest or cargo).
schema_version = 1

[tools]
cargo = "cargo"
rustc = "rustc"

[output]
results_root = "test-results"

[quality]
evidence_root = "analysis/quality-gates"
advisory_max_age_seconds = 86400

[testing]
runner = "nextest"
config = "config/nextest.toml"
profile = "default"
ci_profile = "ci"
