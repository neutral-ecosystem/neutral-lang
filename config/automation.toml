# Local defaults for repository automation. Environment overrides are optional:
# NEUTRAL_CARGO_COMMAND, NEUTRAL_RUSTC_COMMAND, NEUTRAL_TEST_RESULTS,
# NEUTRAL_TEST_RUNNER (nextest or cargo), and NEUTRAL_TEST_VERBOSE (true or false).
# Colors follow CARGO_TERM_COLOR=auto|always|never; NO_COLOR disables colors.
schema_version = 1

[tools]
cargo = "cargo"
rustc = "rustc"

[output]
results_root = "test-results"

[quality]
evidence_root = "analysis/quality-gates"
advisory_max_age_seconds = 86400

[testing]
verbose = false
runner = "nextest"
config = "config/nextest.toml"
profile = "default"
ci_profile = "ci"
mutation_profile = "mutation"
