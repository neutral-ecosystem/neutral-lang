# Cargo.lock is the sole resolved dependency lock. Registry packages must carry
# checksums; Git dependencies and paths outside this workspace are forbidden.
schema_version = 1
lockfile = "Cargo.lock"
isolated_tool_lockfiles = ["fuzz/Cargo.lock"]
review = "quality/dependency-review.md"
allow_crates_io_registry = true
allow_git_sources = false
allow_external_paths = false
