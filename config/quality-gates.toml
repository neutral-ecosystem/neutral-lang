# Stage 9 quality thresholds. A gate is not a pass until its named tool has
# produced retained evidence for the exact candidate under review.
[coverage]
tool = "cargo-llvm-cov"
minimum_line_percent = 85
minimum_function_percent = 90
minimum_region_percent = 80
observed_line_percent = 90.57
observed_function_percent = 90.71
observed_region_percent = 81.72
status = "pass"

[mutation]
tool = "cargo-mutants"
critical_target = "crates/neutral-ir/src/language.rs"
minimum_caught_percent = 100
observed_mutants = 38
observed_caught = 38
status = "pass"

[fuzz]
tool = "cargo-fuzz"
targets = ["source", "vocabulary", "ir", "formatter", "probe"]
minimum_seconds_per_target = 900
readiness_runs_per_target = 256
status = "full-campaign-pass"

[performance]
harness = "neutral-bench/stage9"
pr_profile = "informational"
release_profile = "five-direct-samples-and-massif-2026-09-08"
soak_profile = "extended-soak-50000-massif-2026-09-08"
status = "pass-local-profiled-runner"
