# SPDX-License-Identifier: Apache-2.0

# Approved quality thresholds. A gate is not a pass until its named tool has
# produced retained evidence for the exact candidate under review.
[coverage]
tool = "cargo-llvm-cov"
toolchain = "nightly-only"
html_output = "analysis/coverage/html/index.html"
json_output = "analysis/coverage/coverage.json"
exclusion_regex = "(^|/)xtask/"
exclusion_policy = "reviewed: repository automation is command-tested separately; production coverage excludes only xtask"
minimum_line_percent = 85
minimum_function_percent = 90
minimum_region_percent = 80
observed_line_percent = 93.86
observed_function_percent = 93.66
observed_region_percent = 85.16
status = "pass"

[mutation]
tool = "cargo-mutants"
# Reviewed critical scope: syntax, shared semantic restrictions, wire, public
# reference checks, and identity framing. This is not a whole-workspace campaign.
critical_targets = [
    "crates/neutral-ir/src/language.rs",
    "crates/neutral-compiler/src/frontend/graph_syntax.rs",
    "crates/neutral-vocabulary/src/composition/values.rs",
    "crates/neutral-encoding/src/composition.rs",
    "crates/neutral-reader/src/composition/references.rs",
    "crates/neutral-ir/src/project_identity/framing.rs",
]
minimum_caught_percent = 100
status = "expanded-scope-requires-new-measurement"

[fuzz]
tool = "cargo-fuzz"
targets = ["source", "vocabulary", "ir", "formatter", "probe"]
corpus_root = "fuzz/corpus"
seed_root = "fuzz/seeds"
source_owner = "neutral-compiler source capture/frontend"
vocabulary_owner = "neutral-vocabulary strict bundle decoder"
ir_owner = "neutral-encoding external artifact decoder"
formatter_owner = "neutral-compiler reference formatter"
probe_owner = "neutral-probe reader-only traversal"
finding_policy = "minimize and promote confirmed findings to deterministic regressions"
mutable_state = "ignored fuzz/corpus and fuzz/artifacts; never portable fixtures"
minimum_seconds_per_target = 15
readiness_runs_per_target = 256
status = "full-campaign-pass"

[performance]
harness = "neutral-bench/performance"
required_phases = [
    "compile-end-to-end", "reader-validation", "artifact-encoding",
    "artifact-decoding", "probe-traversal", "declaration-growth", "concurrent-isolation",
    "composition-capture", "composition-graph", "composition-compile", "composition-reader",
    "composition-encode", "composition-decode", "composition-view", "composition-identities",
    "composition-cache-warm", "composition-cache-changed", "composition-growth", "composition-concurrent",
]
pr_profile = "informational"
release_profile = "five-direct-samples-and-massif-2026-09-08"
soak_profile = "extended-soak-50000-massif-2026-09-08"
status = "expanded-scope-requires-new-measurement"
