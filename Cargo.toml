[workspace]
resolver = "3"
members = [
    "crates/neutral-core",
    "crates/neutral-ir",
    "crates/neutral-vocabulary",
    "crates/neutral-compiler",
    "crates/neutral-reader",
    "crates/neutral-probe",
    "crates/neutral-cli",
    "crates/neutral-test-support",
    "crates/neutral-test-suite",
    "crates/neutral-bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/neutral-lang/neutral-lang"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
debug = 2
overflow-checks = true

[profile.test]
debug = 2
overflow-checks = true

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "none"

[profile.bench]
debug = 1
lto = "thin"
